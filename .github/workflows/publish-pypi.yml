name: Publish tabletop-simulator-cli 0.1.1 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.1.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.1
  RELEASE_SHA: 6b50e0007bd664e7e54f5d757f7890e729674a67
  PACKAGE_NAME: tabletop-simulator-cli
  PACKAGE_VERSION: 0.1.1

jobs:
  build:
    name: Build and verify tagged distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          test "${remote_sha}" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          actual_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "${actual_version}" = "${PACKAGE_VERSION}"

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          uv venv --seed .smoke
          uv pip install --python .smoke/bin/python --no-index --find-links dist "${PACKAGE_NAME}==${PACKAGE_VERSION}"
          .smoke/bin/tts --help

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to production PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tabletop-simulator-cli
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Refuse an existing project or version
        shell: bash
        run: |
          set -euo pipefail
          project_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://pypi.org/pypi/tabletop-simulator-cli/json')"
          version_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://pypi.org/pypi/tabletop-simulator-cli/0.1.1/json')"
          test "${project_status}" = "404"
          test "${version_status}" = "404"

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist/
