[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-cli"
version = "0.1.0"
description = "Deterministic, read-only audits for Tabletop Simulator saves"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tts = "tts_cli.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/tts_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
